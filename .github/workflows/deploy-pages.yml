name: Deploy Nathe website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "research.js"
      - "research-index.json"
      - "README.md"
      - "benchmarks/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Prepare standalone site
        run: |
          mkdir -p site/benchmarks
          cp index.html site/index.html
          cp README.md site/README.md
          cp research.js site/research.js
          cp research-index.json site/research-index.json
          cp benchmarks/nathe-generation-benchmark.json site/benchmarks/nathe-generation-benchmark.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
